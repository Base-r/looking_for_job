# ============================================================================
#  НАСТРОЙКИ БОТА И ЛОГИКА РЕШЕНИЙ
#
#  Личное лежит в двух отдельных файлах в корне проекта:
#    profile.md      — кто вы, что ищете и КАК LLM оценивает вакансии
#    letter_style.md — тон, длина и структура сопроводительного письма
#  Здесь — механика: что искать, что отсекать без LLM, пороги решений.
#  Изменения действуют со следующего прогона, перезапуск не нужен.
#
#  Как вакансия проходит воронку:
#    1. Поиск hh по [search] → новые вакансии (уже виденные пропускаются)
#    2. Жёсткие фильтры без LLM: зарплата ниже минимума, гео/формат, блэклист
#    3. LLM ставит скор 0-100 по profile.md
#    4. Скор >= [scoring].maybe_min → LLM пишет письмо → вакансия в «парковку»
#    5. Вы решаете в окне approve: y — отклик, n — пропуск, e — правка письма
#       (автоотклик выключен: [scoring].auto_approve_min = 0)
# ============================================================================

# ---------------------------------------------------------------- ЗАРПЛАТА --
# Минимум на руки в долларах. Вакансия отсекается без LLM, если:
#   - верх вилки (net) ниже минимума;
#   - указана только нижняя граница и она ниже min_from_ratio × минимум.
# Вилка не указана — проходит дальше, решает LLM.
floor_net_usd = 600
min_from_ratio = 0.8
# Свежесть публикации в часах (0 = не проверять: окно поиска режет само).
max_age_hours = 0

[files]
# Пути к личным файлам (относительно корня проекта).
profile = "profile.md"
letter_style = "letter_style.md"

# Курсы для сравнения с минимумом: рублей за единицу валюты. Грубый
# ориентир — обновляйте, если курс сильно сдвинулся.
[currency_rates_rub]
USD = 95.0
EUR = 105.0
UZS = 0.0075
KZT = 0.19
BYN = 29.0
KGS = 1.1

# ------------------------------------------------------- ГЕО И ФОРМАТ РАБОТЫ --
# Ташкент: офис, гибрид или удалёнка. Всё остальное — только удалёнка.
[geo]
enabled = true
remote_ok = true
# 2759 = Ташкент (справочник hh /areas).
areas = ["2759"]

# ----------------------------------------------------- ШУМ ПО НАЗВАНИЮ --
# Вакансии с такими словами в НАЗВАНИИ отсекаются до LLM (бесплатно).
# Нужно для широких источников: специализации и «похожие на резюме».
# Исключения на стороне hh не годятся — они ищут слово во всём тексте.
[title_filter]
enabled = true
exclude = '''\b1[СсCc]\b|маркетплейс|спортивн|\bSMM\b|маркетолог|продаж|бухгалтер|трейдер|кредитн|закуп|курьер|оператор|рекрутер|товаровед|кладовщ'''

# ------------------------------------------------------------------ ПОИСК --
[search]
# Запросы ищутся в НАЗВАНИИ вакансии (см. search_field ниже): меньше мусора,
# точнее выдача. Каждый запрос — отдельный вызов hh, дубликаты склеиваются.
queries = [
    "project manager",
    "руководитель проектов",
    "менеджер проектов",
    "delivery manager",
    "product owner",
    "product manager",
    "менеджер продукта",
    "продакт менеджер",
    "бизнес-аналитик",
    "business analyst",
    "системный аналитик",
    "аналитик данных",
    "data analyst",
    "data scientist",
    "ассистент руководителя проектов",
    # в Узбекистане и Казахстане часто так называют junior-PM и аналитиков
    "project coordinator",
    "координатор проектов",
    "product analyst",
    "продуктовый аналитик",
    # аналитика под резюме «Бизнес-аналитик / Системный аналитик»
    '"BI-аналитик" OR "BI аналитик" OR "BI analyst"',
    '"младший аналитик" OR "junior аналитик" OR "junior analyst" OR "аналитик junior" NOT 1С NOT SMM NOT маркетинг NOT маркетолог NOT финансовый NOT трейдер NOT продаж NOT спортивный NOT медиа NOT товар NOT маркетплейс NOT закуп NOT HR',
    # широкий: всё со словом «аналитик» в названии, кроме чужих профессий;
    # остальной шум отсеивает LLM по profile.md
    'аналитик NOT 1С NOT SMM NOT маркетинг NOT маркетолог NOT маркетинговый NOT финансовый NOT трейдер NOT продаж NOT спортивный NOT медиа NOT товар NOT маркетплейс NOT закуп NOT HR NOT бухгалтер NOT кредит',
]
# Окно поиска: с прошлого успешного прогона (не меньше min_hours и не больше
# hours). Запуск ручной: hours = 72 — запуск раз в день-три ничего не теряет.
hours = 72
min_hours = 0.5
# Сколько времени прошло с публикации вакансии, в днях: каждый поиск берёт
# вакансии, вышедшие от min_age_days до max_age_days назад, и страница
# отбора по умолчанию показывает тот же диапазон (там его можно менять).
# max_age_days = 0 — как раньше: окно «с прошлого поиска» (hours выше).
# min_age_days = 0 — включая самые свежие.
min_age_days = 0
max_age_days = 7
# 100 — максимум hh: вдвое меньше запросов, чем при 50.
per_page = 100
# Потолок новых вакансий за прогон (дешёво — без LLM).
max_new_per_run = 600
# Сколько вакансий оценивает LLM за прогон (это то, что стоит денег).
# Не хватило — остальные ждут в очереди и оцениваются в следующих прогонах.
max_scored_per_run = 150
# Пауза между запросами описаний вакансий, сек. Без неё hh через несколько
# десятков описаний требует капчу (проверка VPN/бота).
card_pause_seconds = 3

# Источники вакансий. Все идут через те же области (scopes), фильтры и оценку.
[search.sources]
# Внешние источники: GeekJob, Habr Career, Telegram. Откликаетесь вы сами
# по ссылке со страницы отбора (бот только находит, оценивает и пишет письмо).
# GeekJob (geekjob.ru): весь список сайта за то же окно, что и hh.
geekjob = true
# Habr Career (career.habr.com): поиск по запросам ниже, уровни qid:
# 1 стажёр, 3 junior, 4 middle (5 senior, 6 lead).
habr = true
habr_queries = ["аналитик", "analyst", "project manager", "руководитель проектов", "менеджер проектов", "product manager", "менеджер продукта"]
habr_qids = ["1", "3", "4"]
# Telegram: открытые каналы с вакансиями (имя после t.me/), без входа в аккаунт.
# Каналы с закрытым веб-превью без входа не читаются — об этом пишет лог поиска.
telegram = true
telegram_channels = [
    "analysts_jobs", "datajobschannel", "uzdev_jobs", "getitrussia",
    "juno_jobs", "relocaty_jobs", "young_june", "projects_jobs", "top_proit",
    "foranalysts", "geekjobs", "forproducts", "hcareers_jobs", "yuniorapp",
    "rabotavmediawe", "itmarket_uz",
]
# Вакансии внешних источников оцениваются, только если название подходит
# под это регулярное выражение (сайты и каналы — все профессии подряд).
# Опыт отсекается по [search.params].experience, если источник его указал.
title_must = 'аналит|analyst|analytics|\bBI\b|data scien|дата-сайент|проектов|проектами|project|менеджер продукта|владелец продукта|продакт|product|delivery|деливери|scrum|координатор|coordinator|\bPMO?\b|owner|требовани|бизнес-процесс'
# Пауза между запросами к внешним сайтам, секунд.
external_pause_seconds = 2
# Поиск по ключевым словам из queries выше.
keywords = true
# Поиск по специализациям hh — без ключевых слов, ловит вакансии с
# нестандартным названием. [] — выключить. ID: 107 Руководитель проектов,
# 73 Менеджер продукта, 150 Бизнес-аналитик, 148 Системный аналитик,
# 10 Аналитик, 156 BI-аналитик/аналитик данных, 164 Продуктовый аналитик,
# 165 Дата-сайентист.
professional_roles = ["107", "73", "150", "148", "10", "156", "164", "165"]
# «Похожие на резюме» — подбор hh по каждому резюме из [[resumes]]
# (как рекомендации на сайте). false — выключить.
similar_to_resumes = true

# Дополнительные фильтры поиска hh (передаются в GET /vacancies как есть).
[search.params]
# Искать только в названии вакансии (убрать строку — искать и в описании).
search_field = "name"
# Опыт: без опыта и 1-3 года. Вакансии «3-6 лет» и «6+» не запрашиваются.
experience = ["noExperience", "between1And3"]

# Отдельные поиски: каждый запрос выше ищется в каждой области.
# Так лимит max_new_per_run не уходит на офисные вакансии в других городах.
[[search.scopes]]
# Удалёнка: Россия, Узбекистан, Казахстан, Беларусь, Кыргызстан, Армения,
# Грузия, Азербайджан, Таджикистан, Кипр, Сербия, ОАЭ.
params = { area = ["113", "97", "40", "16", "48", "13", "28", "9", "86", "236", "146", "208"], work_format = ["REMOTE"] }

[[search.scopes]]
# Ташкент: любой формат (офис, гибрид, удалёнка).
params = { area = ["2759"] }

# --------------------------------------------------------- ЛОГИКА РЕШЕНИЙ --
[scoring]
# Сколько параллельных запросов к LLM (оценка + письмо в одном потоке).
# DeepSeek напрямую держит 6 спокойно; при ошибках 429 — уменьшить.
workers = 6
# Скор от maybe_min: пишется письмо и вакансия попадает к вам на решение.
# 45: решение пользователя — показывать и пограничные вакансии (смежные роли,
# СНГ), окончательный отбор делает человек. Посмотреть отсеянное: python -m snpr list --all
maybe_min = 35
# Скор от target_min — «точное попадание» (в списке помечается зелёным).
target_min = 80
# Автоотклик без вашего решения при скоре >= этого числа.
# 0 = ВЫКЛЮЧЕН: всё идёт к вам в approve. Включить потом: например, 85.
auto_approve_min = 0

[send]
# Принудительно одно резюме для всех откликов (пусто — выбор по [[resumes]]).
resume_id = ""
# Только для автоотклика: не старше N минут с публикации (иначе — к вам).
max_age_minutes = 60

# ------------------------------------------------------------------ РЕЗЮМЕ --
# Резюме для откликов. При оценке вакансии DeepSeek выбирает подходящее
# по описанию use_for; на странице отбора его можно поменять.
# Первое — основное (если LLM не выбрал или выбрал неизвестное).
# Список резюме на аккаунте с ID: python -m snpr resumes
# Неопубликованные резюме hh для отклика не принимает — они не предлагаются.
# Реальные блоки [[resumes]] лежат в snpr/config.local.toml (он не в git):
# [[resumes]]
# id = "ID из команды resumes"
# title = "Название"
# use_for = "для каких вакансий подходит"

[approve]
# Где решать по очереди вакансий, когда джоба нашла подходящие:
# web — страница в браузере (python -m snpr web), console — консольное окно.
ui = "web"

[letter]
# llm — отдельное письмо под каждую вакансию по letter_style.md + profile.md.
# static — одинаковый текст static_text для всех.
mode = "llm"
# 0 — сухо и одинаково, 1 — разнообразно. 0.6 — живо, но без фантазий.
temperature = 0.6
# Потолок длины письма в словах: длиннее — бот просит DeepSeek сократить.
max_words = 110
# Сколько ваших последних правок писем показывать LLM как пример стиля.
style_examples_from_edits = 3
static_text = '''Здравствуйте!

Меня заинтересовала ваша вакансия. Последние два года веду мобильное приложение для предпринимателей как IT Project Manager: от требований заказчика до релиза в App Store и Google Play, вместе с командой из 5 человек.

Буду рад обсудить, чем могу быть полезен.'''

# Зарплатные ожидания в письме, если работодатель прямо просит их указать.
# false — никогда не писать сумму (просьба видна на странице, решаете сами);
# true — ответить желаемой суммой из profile.md.
salary_on_request = false
contacts_always = true

# Контакты кандидата. contacts_always = true (выше, в [letter]) — подпись
# с ними в конце каждого письма; false — только если работодатель прямо
# просит указать контакт. Проверка письма пропускает только эти контакты.
# Лишний контакт — удалите строку.
# Настоящие значения — в snpr/config.local.toml (он не в git).
[letter.contacts]
telegram = ""
email = ""
phone = ""

[letter_guard]
# Проверка письма перед отправкой: числа — только из profile.md, ссылки —
# только с этими префиксами, контакты запрещены (они есть в резюме).
allowed_url_prefixes = []

# ------------------------------------------------ ГЕЙТЫ, РЕШАЕТ LLM (выкл) --
# Эти фильтры выключены: грейд, аутсорс и госкомпании оценивает LLM по
# profile.md. Включить жёсткое отсечение — enabled = true.
[grade]
enabled = false
exclude_pattern = '''(?i)senior|lead|head|руководитель отдела|директор'''
exclude_experience = ["between3And6", "moreThan6"]

[vendor]
enabled = false
employers = '''(?i)SimbirSoft|СимбирСофт|Симбирсофт|Selecty|Селекти|Luxoft|Люкссофт|EPAM|ЭПАМ|Иннотех|Innotech|IBS|Аксеникс|Axenix|Рексофт|Reksoft|Талмер|Talmer|Синимекс|Cinimex|КРОК|KROK|ЛАНИТ|Lanit|Диасофт|Diasoft|Форс|FORS|Т1|Т-1|Technopolis|Arcadia|Аркадия|GlowByte|ГлоуБайт|iTechArt|ИТевропейск|Belitsoft|Onliner|ScienceSoft|СайенсСофт|Naukma|Сьерра|Sierra|Datasight|Датасайт|«Ай-Ти Сервис»|IT-Agency|РДТЕХ|RD-Tech|Бифит|Bifit|Лига Цифровой Экономики|Цифровой аналитик'''
keywords = '''аутсорс|аутстафф|аутсорсинг|под ключ заказчик|интеграц.+проект|сотрудничаем с заказчик|для наших заказчиков|на проект заказчика|аутстаффинг|вендорска|интегратор'''

[gov]
enabled = false
employers = '''(?i)Росгосстрах|РОСГОССТРАХ|РЖД|Российские железные|Почта России|Ростех|Росте?хнологии|Росатом|Роскосмос|Госкорпорация|Ростелеком|ГАЗПРОМ.?медиа|Газпром нефть|Швабе|Ростсельмаш|Уралвагонзавод|Оборонпром|Высокоточные комплексы|Тактическое ракетное|Минцифры|Министерство|ФГУП|ФГБУ|ФГБОУ|Федеральн.{0,30}(служб|агентств|управлен)|Госк|Единая платформа государственного|ЕПГУ|МФЦ|Мои Документы|ВЭБ.РФ|Дом.РФ|Российский квантовый|Институт развития|военн|войск|МВД|ФСБ|ФСО|ГРУ|Минобороны|оборонн|оборон|ВПК|Спецсвяз|Космические системы|Российская космическая|Корпорация МСП|Почта Банка|ЦБ РФ|Банк России|Минздрав|Минобрнауки|Минпросвещения|Казначейств|ФНС|ФТС|Рос-тех-регулирование|Росавиация|Росморречфлот|Роспотреб|Ространс|Росприрод|ВНИИ|ЦНИИ|НИИ |Университет|Академия|Институт|УрФУ|МГУ|СПбГУ|ВШЭ|РАНХиГС|Сколтех|НИЯУ МИФИ|Гринатом|Росатом цифровой|РТ Проектные технологии|РТ-Проектные'''
keywords = '''госкорпорац|государственн.{0,20}компан|федеральн.{0,30}ведомств|оборонн.{0,20}промышлен|каз[её]нн.{0,20}учрежден|госслужб|госзаказ|44-ФЗ|223-ФЗ|ФЗ-44|ФЗ-223|гособоронзаказ|госорганизац|гос.?(учрежден|структур)'''

# ------------------------------------------------------------- РАСПИСАНИЕ --
[job]
# Поиск раз в день в это время (ЧЧ:ММ). Компьютер был выключен — поиск
# запустится, как только его включат. Страница отбора сама не открывается.
# daily_at = "" — вместо этого каждые interval_minutes минут.
# После изменения: python -m snpr job on (перерегистрирует задачу).
daily_at = "09:00"
interval_minutes = 20

# --------------------------------------------------- ЖИЗНЬ ПОСЛЕ ОТКЛИКА --
[nanny]
# `python -m snpr nanny` — отчёт о реакциях работодателей.
silence_days = 3.0

[raise]
# Автоподнятие резюме в поиске hh раз в 4 ч в рабочие часы (по Москве).
enabled = true
interval_hours = 4.0
active_from_hour = 9
active_to_hour = 19
resume_id = ""

[cleanup]
# `python -m snpr cleanup` — показать отказы и тишину дольше N дней
# (снять — с флагом --apply).
older_than_days = 14.0

[blacklist]
# Работодатели, которых пропускать: `python -m snpr blacklist add <ссылка>`.
file = "data/blacklist.txt"
